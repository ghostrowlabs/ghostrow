[project]
name = "ghostrow-training"
version = "0.1.0"
description = "Training and evaluation for the Ghostrow column-meaning model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.*",
  "transformers>=4.57,<5",
  "tokenizers>=0.22",
  "numpy>=2",
  "onnx>=1.19",
  "onnxruntime>=1.23",
  "onnxscript>=0.5",
  "safetensors>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
