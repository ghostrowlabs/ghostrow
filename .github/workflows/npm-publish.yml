name: Publish to npm

# Publishes the npm package for a version that is already released on GitHub,
# for when the npm step of the release workflow has to be repeated.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json and an existing v* tag)"
        required: true

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the version and its release
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then echo "::error::package.json is $pkg, not $VERSION"; exit 1; fi
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "::error::tag v$VERSION does not exist"; exit 1; }
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          if [ -z "${{ vars.LICENSE_PUBLIC_KEYS }}" ]; then echo "::error::Set the repository variable LICENSE_PUBLIC_KEYS."; exit 1; fi
          # Same release date as the tagged build.
          echo "date=$(git log -1 --format=%cd --date=format:%Y-%m-%d "v$VERSION")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
        env:
          LICENSE_PUBLIC_KEYS: ${{ vars.LICENSE_PUBLIC_KEYS }}
          GHOSTROW_RELEASE_DATE: ${{ steps.meta.outputs.date }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
